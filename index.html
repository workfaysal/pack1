<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SnapStyle Friend Pack 1</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#10002b,#240046);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:22px}.app{width:min(430px,100%);text-align:center}h1{margin:4px 0}.sub,#status{color:#cbb7e8;font-size:14px}.camera{position:relative;aspect-ratio:3/4;background:#160d25;border:3px solid #7b2cbf;border-radius:26px;overflow:hidden;margin-top:16px}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}canvas{pointer-events:none}.placeholder{position:absolute;inset:0;display:grid;place-items:center;padding:30px;color:#cbb7e8}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}button{border:0;border-radius:13px;padding:11px 4px;background:#3c096c;color:#fff;font-weight:bold;cursor:pointer}.active{background:#e0aaff;color:#240046}.capture{width:100%;margin-top:10px;background:#ffdd00;color:#181000;font-size:16px}#status{margin-top:9px;min-height:18px}
</style></head><body><main class="app"><h1>Friend Pack 1</h1><div class="sub">Neon • Royal • Kitty • Galaxy • Rain</div><div class="camera"><video id="video" autoplay playsinline></video><canvas id="overlay"></canvas><div id="placeholder" class="placeholder">Allow camera access to try the filters.</div></div><div class="controls"><button class="active" data-filter="neon">⚡ Neon</button><button data-filter="royal">👑 Royal</button><button data-filter="kitty">🐱 Kitty</button><button data-filter="galaxy">🌌 Galaxy</button><button data-filter="rain">🌧️ Rain</button><button id="cameraBtn">📷 Camera</button></div><button id="capture" class="capture">📸 Take Photo</button><div id="status">Starting camera...</div></main><script>
const video=document.querySelector('#video'),canvas=document.querySelector('#overlay'),ctx=canvas.getContext('2d'),statusEl=document.querySelector('#status'),placeholder=document.querySelector('#placeholder');let current='neon';
async function startCamera(){try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;placeholder.style.display='none';statusEl.textContent='Camera ready';}catch(e){statusEl.textContent='Camera unavailable';placeholder.textContent='Open through localhost or HTTPS, then allow camera access.';}}
function resize(){canvas.width=video.videoWidth||430;canvas.height=video.videoHeight||573}video.addEventListener('loadedmetadata',resize);window.addEventListener('resize',resize);
function label(t,x,y,s,c='#fff'){ctx.font=`bold ${s}px Arial`;ctx.textAlign='center';ctx.fillStyle=c;ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.fillText(t,x,y);ctx.shadowBlur=0}
function draw(){const w=canvas.width,h=canvas.height;if(!w){requestAnimationFrame(draw);return}ctx.clearRect(0,0,w,h);
if(current==='neon'){ctx.strokeStyle='#00f5d4';ctx.lineWidth=9;ctx.strokeRect(13,13,w-26,h-26);label('NEON ENERGY',w/2,62,32,'#f15bb5');for(let i=0;i<7;i++)label('⚡',35+(i*71)%w,125+(i*83)%(h-190),28,'#fee440')}
if(current==='royal'){label('👑',w/2,115,78);label('ROYAL MODE',w/2,h-42,34,'#ffd166');ctx.strokeStyle='#ffd166';ctx.lineWidth=5;ctx.strokeRect(18,18,w-36,h-36)}
if(current==='kitty'){label('🐱',w/2,105,80);label('MEOW!',w/2,h-45,36,'#ff99c8');for(let i=0;i<3;i++){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(w/2-35,220+i*14);ctx.lineTo(w/2-130,205+i*24);ctx.moveTo(w/2+35,220+i*14);ctx.lineTo(w/2+130,205+i*24);ctx.stroke()}}
if(current==='galaxy'){ctx.fillStyle='rgba(40,0,90,.28)';ctx.fillRect(0,0,w,h);for(let i=0;i<35;i++){ctx.fillStyle=i%3?'#fff':'#f0a6ff';ctx.beginPath();ctx.arc((i*83)%w,(i*137)%h,2+i%3,0,7);ctx.fill()}label('LOST IN THE STARS',w/2,h-42,27,'#e0aaff')}
if(current==='rain'){ctx.fillStyle='rgba(20,70,130,.22)';ctx.fillRect(0,0,w,h);label('RAINY MOOD',w/2,55,32,'#a9def9');for(let i=0;i<18;i++){ctx.strokeStyle='#72ddf7';ctx.lineWidth=3;ctx.beginPath();let x=(i*59)%w,y=(i*91)%h;ctx.moveTo(x,y);ctx.lineTo(x-8,y+25);ctx.stroke()}}
requestAnimationFrame(draw)}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{current=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');statusEl.textContent=b.textContent.trim()+' selected'});document.querySelector('#cameraBtn').onclick=startCamera;document.querySelector('#capture').onclick=()=>{if(!video.videoWidth){statusEl.textContent='Wait for the camera first';return}const p=document.createElement('canvas');p.width=video.videoWidth;p.height=video.videoHeight;const c=p.getContext('2d');c.drawImage(video,0,0,p.width,p.height);c.drawImage(canvas,0,0,p.width,p.height);const a=document.createElement('a');a.download='friend-pack-1.png';a.href=p.toDataURL('image/png');a.click();statusEl.textContent='Photo saved!'};startCamera();draw();
</script></body></html>
